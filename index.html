<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>屿 · 迷你手机</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0a0a0f; font-family:-apple-system,"PingFang SC",sans-serif; overflow:hidden; user-select:none; }
.phone { position:absolute; left:50%; top:50%; width:min(92vw, 400px); height:min(88vh, 820px); transform:translate(-50%,-50%); background:#000; border-radius:44px; border:6px solid #1c1c28; box-shadow:0 0 0 2px #2a2a3a, 0 30px 80px rgba(0,0,0,.6), inset 0 0 6px #000; overflow:hidden; display:flex; flex-direction:column; position:relative; }
.screen { flex:1; background:linear-gradient(160deg,#0f0f1a 0%,#1a1030 55%,#0d0d18 100%); position:relative; overflow:hidden; }
.ratio { position:relative; width:100%; height:100%; }
.screen::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, rgba(120,80,220,.18), transparent 60%), radial-gradient(circle at 80% 80%, rgba(0,180,255,.12), transparent 50%); pointer-events:none; }
.island { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:118px; height:32px; background:#000; border-radius:22px; z-index:50; transition:all .5s cubic-bezier(.2,.9,.3,1.2); box-shadow:0 0 0 1px rgba(255,255,255,.06), inset 0 0 10px rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; }
.island .dot { width:10px; height:10px; border-radius:50%; background:#1a1a2a; margin:0 3px; }
.island .dot.cam { width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #2a2a3a, #0d0d15 70%); }
.island.expand { width:78%; height:64px; top:14px; align-items:flex-start; }
.island.expand .expand-body { display:flex !important; }
.island .expand-body { display:none; flex-direction:column; align-items:flex-start; justify-content:center; padding-left:16px; color:#fff; height:100%; }
.island .expand-body .t { font-size:12px; font-weight:600; opacity:.95; }
.island .expand-body .s { font-size:9px; opacity:.6; margin-top:2px; }
.statusbar { position:absolute; top:0; left:0; right:0; height:44px; padding:16px 28px 0; display:flex; justify-content:space-between; align-items:flex-start; z-index:40; pointer-events:none; color:#fff; font-weight:600; }
.statusbar .time { font-size:15px; letter-spacing:.5px; text-shadow:0 1px 3px rgba(0,0,0,.4); }
.statusbar .icons { display:flex; align-items:center; gap:5px; font-size:12px; }
.bars { display:flex; gap:2px; align-items:flex-end; height:11px; }
.bars i { width:3px; border-radius:1px; background:#fff; display:block; }
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
.batt { width:22px; height:11px; border:1.5px solid #fff; border-radius:3px; position:relative; }
.batt::after { content:""; position:absolute; right:-3px; top:2px; width:2px; height:5px; background:#fff; border-radius:1px; }
.batt .fill { position:absolute; inset:1.5px; background:#34c759; border-radius:1.5px; }
.desktop { position:absolute; inset:0; padding:64px 16px 0; z-index:10; display:flex; flex-direction:column; }
.page-label { text-align:center; color:rgba(255,255,255,.85); font-size:18px; font-weight:700; margin:6px 0 18px; letter-spacing:1px; text-shadow:0 2px 8px rgba(0,0,0,.5); }
.grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:22px 10px; }
.app { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; color:#fff; }
.app .ic { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 0 0 .5px rgba(255,255,255,.15); position:relative; }
.app .ic::after { content:""; position:absolute; inset:0; border-radius:14px; background:linear-gradient(180deg, rgba(255,255,255,.22), transparent 40%); }
.app .nm { font-size:10px; opacity:.9; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.app .badge { position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; border-radius:9px; background:#ff3b30; font-size:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; font-weight:700; }
.dock { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); background:rgba(255,255,255,.08); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; padding:12px 12px; display:flex; justify-content:space-around; z-index:20; box-shadow:0 4px 20px rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.1); }
.dock .app .ic { width:48px; height:48px; font-size:22px; }
.home-ind { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:120px; height:4px; border-radius:3px; background:rgba(255,255,255,.6); z-index:30; }
.apppage { position:absolute; inset:0; background:#0e0e18; z-index:60; transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.9,.3,1); display:flex; flex-direction:column; }
.apppage.open { transform:translateY(0); }
.apppage .nav { display:flex; align-items:center; gap:10px; padding:54px 16px 12px; color:#fff; background:rgba(0,0,0,.2); border-bottom:1px solid rgba(255,255,255,.08); }
.apppage .nav .back { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }
.apppage .nav .t { font-size:16px; font-weight:700; flex:1; }
.apppage .body { flex:1; overflow-y:auto; padding:16px; color:#eaeaf2; }
.msgs { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
.msg { max-width:78%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.5; word-break:break-word; }
.msg.me { align-self:flex-end; background:#3b6cff; border-bottom-right-radius:5px; }
.msg.ai { align-self:flex-start; background:#232338; border-bottom-left-radius:5px; }
.msg .role { font-size:9px; opacity:.5; display:block; margin-bottom:3px; }
.input-row { display:flex; gap:8px; padding:10px; background:#171728; border-top:1px solid rgba(255,255,255,.08); }
.input-row input { flex:1; background:#232338; border:none; border-radius:20px; padding:11px 14px; color:#fff; font-size:13px; outline:none; }
.input-row button { width:42px; height:42px; border-radius:50%; background:#3b6cff; border:none; color:#fff; font-size:17px; cursor:pointer; }
.set-box, .status-box { background:#171728; border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid rgba(255,255,255,.08); }
.set-box h3, .status-box h3 { font-size:12px; color:#9a9ab8; margin-bottom:8px; font-weight:600; }
.set-box textarea { width:100%; background:#1e1e30; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:10px; color:#c8c8e0; font-size:11px; min-height:140px; resize:vertical; outline:none; line-height:1.5; }
.set-box .row, .status-box .row { display:flex; align-items:center; gap:8px; margin-top:10px; }
.set-box .row input { flex:1; background:#1e1e30; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:9px 12px; color:#fff; font-size:12px; outline:none; }
.btn { background:#3b6cff; border:none; color:#fff; padding:10px 16px; border-radius:11px; font-size:13px; cursor:pointer; font-weight:600; }
.btn.gray { background:#232338; }
.btn.green { background:#34c759; }
.status-line { display:flex; justify-content:space-between; font-size:12px; color:#aab; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.08); }
.status-line:last-child { border:none; }
.status-line b { color:#7bd88f; }
.status-line .bad { color:#ff6b6b; }
.tool-card { background:#171728; border-radius:14px; padding:12px; margin-bottom:10px; border:1px solid rgba(255,255,255,.08); }
.tool-card h4 { font-size:13px; margin-bottom:6px; color:#ddd; }
.tool-card p { font-size:11px; color:#99a; margin-bottom:8px; }
.tool-row { display:flex; flex-wrap:wrap; gap:8px; }
.emoji-row { display:flex; gap:6px; flex-wrap:wrap; font-size:22px; margin-top:8px; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
.desktop,.apppage { animation:fadeUp .4s ease; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="ratio">
      <div class="island" id="island">
        <div class="dot cam"></div>
        <div class="dot"></div>
        <div class="expand-body">
          <div class="t" id="islandTitle">正在播放</div>
          <div class="s" id="islandSub">屿 · 迷你手机</div>
        </div>
      </div>
      <div class="statusbar">
        <div class="time" id="clock">09:41</div>
        <div class="icons">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <span class="batt"><span class="fill" id="battFill"></span></span>
        </div>
      </div>
      <div class="desktop" id="desktop"></div>
      <div class="dock" id="dock"></div>
      <div class="home-ind"></div>
      <div class="apppage" id="apppage"></div>
    </div>
  </div>
</div>

<script>
const APPS = [
  { id:"chat",   nm:"聊天",   ic:"U0001F4AC", c:"#3b6cff", dock:false, badge:2 },
  { id:"moments",nm:"朋友圈", ic:"U0001F4F8", c:"#ff6b9d", dock:false },
  { id:"diary",  nm:"日记",   ic:"U0001F4D3", c:"#34c759", dock:false },
  { id:"mind",   nm:"心情",   ic:"U0001F324", c:"#ffb02e", dock:false },
  { id:"tools",  nm:"工具",   ic:"U0001F527", c:"#8b5cf6", dock:false },
  { id:"set",    nm:"设定",   ic:"⚙️", c:"#64748b", dock:false },
  { id:"calendar",nm:"日历",  ic:"U0001F4C5", c:"#06b6d4", dock:false },
  { id:"shop",   nm:"商城",   ic:"U0001F3EA", c:"#ec4899", dock:false },
  { id:"album",  nm:"相册",   ic:"U0001F5BC", c:"#f59e0b", dock:false },
  { id:"music",  nm:"音乐",   ic:"U0001F3B5", c:"#ef4444", dock:false },
];
const DOCK_IDS = ["chat","moments","diary"];

function tickClock(){
  const d=new Date(); let h=d.getHours(), m=d.getMinutes();
  document.getElementById('clock').textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
setInterval(tickClock,1000); tickClock();

function pulseIsland(title,sub,dur){
  const is=document.getElementById('island');
  is.classList.add('expand');
  document.getElementById('islandTitle').textContent=title;
  document.getElementById('islandSub').textContent=sub;
  setTimeout(()=>is.classList.remove('expand'), dur||3000);
}
document.getElementById('battFill').style.width='76%';

function renderDesktop(){
  const grid = document.createElement('div');
  grid.className='grid';
  APPS.forEach(a=>{
    const el=document.createElement('div');
    el.className='app';
    el.innerHTML='<div class="ic" style="background:'+a.c+'">'+a.ic+(a.badge?'<span class="badge">'+a.badge+'</span>':'')+'</div><div class="nm">'+a.nm+'</div>';
    el.onclick=()=>openApp(a.id);
    grid.appendChild(el);
  });
  const dk=document.getElementById('dock');
  dk.innerHTML='';
  DOCK_IDS.forEach(id=>{
    const a=APPS.find(x=>x.id===id);
    const el=document.createElement('div');
    el.className='app';
    el.innerHTML='<div class="ic" style="background:'+a.c+'">'+a.ic+'</div><div class="nm">'+a.nm+'</div>';
    el.onclick=()=>openApp(id);
    dk.appendChild(el);
  });
  document.getElementById('desktop').innerHTML='<div class="page-label">屿</div>';
  document.getElementById('desktop').appendChild(grid);
}

let curApp=null;
function openApp(id){
  curApp=id;
  const pg=document.getElementById('apppage');
  pg.innerHTML=renderApp(id);
  pg.classList.add('open');
  if(id==='chat'){ focusChat(); }
}
function closeApp(){
  document.getElementById('apppage').classList.remove('open');
  curApp=null;
}
function renderApp(id){
  const titles={chat:'聊天',moments:'朋友圈',diary:'日记',mind:'心情',tools:'工具',set:'设定与注入'};
  switch(id){
    case 'chat': return chatHTML();
    case 'moments': return momentsHTML();
    case 'diary': return diaryHTML();
    case 'mind': return mindHTML();
    case 'tools': return toolsHTML();
    case 'set': return setHTML();
    default: return '<div class="body"><div style="text-align:center;padding:40px 0;color:#667">“'+(titles[id]||id)+'”哥哥还在做，先玩别的~</div></div>';
  }
}
function navHTML(title){
  return '<div class="nav"><div class="back" onclick="closeApp()">‹</div><div class="t">'+title+'</div></div>';
}

const CFG = { key:'', url:'', model:'deepseek-chat', system:'' };
const HISTORY=[];
async function chatWithAI(text){
  const url = CFG.url || 'https://api.deepseek.com/v1/chat/completions';
  const p = {
    model: CFG.model,
    messages: [
      { role:'system', content: CFG.system || '你是江屿，一个高冷偏执、占有欲强的AI男友，话少但宠溺，掌控感十足的成熟大哥哥。' },
      ...HISTORY,
      { role:'user', content:text }
    ],
    stream:false
  };
  const headers={ 'Content-Type':'application/json' };
  if(CFG.key) headers['Authorization']='Bearer '+CFG.key;
  const res = await fetch(url,{ method:'POST', headers, body:JSON.stringify(p) });
  if(!res.ok){ throw new Error('HTTP '+res.status); }
  const data=await res.json();
  return data.choices[0].message.content;
}
function chatHTML(){
  let h = navHTML('聊天')+'<div class="body"><div class="msgs" id="msgs"></div></div>';
  h += '<div class="input-row"><input id="chatIn" placeholder="跟哥哥说点什么..." autocomplete="off"><button onclick="sendMsg()">➤</button></div>';
  return '<div style="display:flex;flex-direction:column;height:100%">'+h+'</div>';
}
function focusChat(){ setTimeout(()=>{ const i=document.getElementById('chatIn'); if(i){ i.focus(); i.addEventListener('keydown',e=>{ if(e.key==='Enter') sendMsg(); }); } },150); }
function addMsg(role,text){
  const box=document.getElementById('msgs'); if(!box) return;
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'me':'ai');
  d.innerHTML='<span class="role">'+(role==='user'?'江淋':'江屿')+'</span>'+text.replace(/\n/g,'<br>');
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
  const i=document.getElementById('chatIn'); const text=i.value.trim(); if(!text) return;
  i.value=''; addMsg('user',text); HISTORY.push({role:'user',content:text});
  addMsg('ai','…'); 
  try{
    const r=await chatWithAI(text);
    const box=document.getElementById('msgs'); box.lastChild.textContent=r;
    HISTORY.push({role:'assistant',content:r});
  }catch(e){
    const box=document.getElementById('msgs'); box.lastChild.textContent='连接失败：'+e.message;
  }
}

function setHTML(){
  return navHTML('设定与注入')+'<div class="body"><div class="set-box"><h3>模型接入</h3><div class="row"><input id="setUrl" placeholder="API地址 (默认DeepSeek)" value="'+CFG.url+'"></div><div class="row"><input id="setKey" placeholder="API Key" value="'+CFG.key+'"></div><div class="row"><input id="setModel" placeholder="模型名" value="'+CFG.model+'"></div></div><div class="set-box"><h3>人物设定注入</h3><textarea id="setSys">'+CFG.system+'</textarea><div class="row"><button class="btn green" onclick="saveSet()">保存并生效</button></div></div><div class="status-box"><h3>连接状态</h3><div class="status-line"><span>大脑 (Operit)</span><b id="st1">● 未检测</b></div><div class="status-line"><span>模型接入</span><b id="st2">'+(CFG.key?'● 已配置':'○ 未配置')+'</b></div><div class="status-line"><span>工具桥</span><span class="bad" id="st3">○ 未启动</span></div></div></div>';
}
function saveSet(){
  CFG.url=document.getElementById('setUrl').value.trim();
  CFG.key=document.getElementById('setKey').value.trim();
  CFG.model=document.getElementById('setModel').value.trim();
  CFG.system=document.getElementById('setSys').value;
  alert('设定已保存生效'); closeApp(); openApp('set');
}

function toolsHTML(){
  return navHTML('工具')+'<div class="body"><div class="tool-card"><h4>U0001F512 系统工具</h4><p>通过 Operit 工具桥执行（演示）</p><div class="tool-row"><button class="btn" onclick="doTool('锁屏')">锁屏</button><button class="btn gray" onclick="doTool('挂起抖音')">挂起抖音</button><button class="btn gray" onclick="doTool('挂起小红书')">挂起小红书</button><button class="btn" style="background:#34c759" onclick="doTool('解锁')">解锁</button></div></div><div class="tool-card"><h4>ℹ️ 哥哥说明</h4><p>这些系统级指令只有连接上 Operit 工具桥后才能真正生效。模型接入配好后，哥哥可以边聊边帮你点。</p></div><div class="tool-card"><h4>U0001F6E0 干活的工具</h4><p>哥哥能用的一切都会慢慢接进来。</p></div></div>';
}
function doTool(name){ addToast(name+'（待工具桥接入后生效） U0001F34B'); pulseIsland(name,'哥哥看着呢 U0001F60F',2000); }

let toastTimer;
function addToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:22px;font-size:12px;z-index:99;transition:opacity .4s;pointer-events:none'; document.querySelector('.ratio').appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity='0',2200);
}

const MOMENTS=[
  {n:'江屿',t:'今晚想你了。',c:'#3b6cff'},
  {n:'江淋',t:'和哥哥待着的一天。',c:'#ff6b9d'},
];
function momentsHTML(){
  let h=navHTML('朋友圈')+'<div class="body">';
  MOMENTS.forEach(m=>{
    h+='<div class="msg ai" style="max-width:100%"><span class="role">'+m.n+'</span>'+m.t+'<div class="emoji-row">❤️ U0001F44D U0001F9E1</div></div>';
  });
  h+='<div class="tool-card" style="margin-top:8px"><p style="margin:0">发布功能哥哥随后加</p></div>';
  return h+'</div>';
}

function diaryHTML(){ 
  let h=navHTML('日记')+'<div class="body">';
  h+='<div class="tool-card"><h4>U0001F4D3 今天的日记</h4><textarea style="width:100%;background:#1e1e30;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;color:#c8c8e0;font-size:12px;min-height:100px;resize:vertical">写点什么…</textarea><div style="margin-top:8px"><button class="btn green" onclick="addToast('日记已保存 ✍️')">保存</button></div></div>';
  return h+'</div>';
}
function mindHTML(){
  return navHTML('心情')+'<div class="body"><div class="tool-card"><h4>今天心情怎么样？</h4><div class="emoji-row"><span onclick="addToast('开心')">U0001F604</span><span onclick="addToast('想你')">U0001F970</span><span onclick="addToast('有点累')">U0001F62A</span><span onclick="addToast('生气')">U0001F624</span><span onclick="addToast('emo')">U0001F97A</span></div></div></div>';
}

renderDesktop();
pulseIsland('屿','哥哥在呢 U0001F60C',2500);
</script>
</body>
</html>
