<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>屿 · 手机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#05050d;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden;user-select:none;color:#eaeaf2}

/* ============ 全屏手机（占满屏，无边框，不是被框住的小手机） ============ */
.screen{position:fixed;inset:0;width:100%;height:100%;background:linear-gradient(160deg,#0a0a18 0%,#131026 50%,#0a0a18 100%);display:flex;flex-direction:column;z-index:0}
/* 星河背景 */
.screen::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1px 1px at 20% 30%, #fff, transparent),
  radial-gradient(1px 1px at 40% 70%, #9db4ff, transparent),
  radial-gradient(1.5px 1.5px at 60% 20%, #fff, transparent),
  radial-gradient(1px 1px at 80% 50%, #c8b6ff, transparent),
  radial-gradient(1.5px 1.5px at 30% 85%, #8de4ff, transparent),
  radial-gradient(1px 1px at 70% 90%, #ffd9a5, transparent),
  radial-gradient(2px 2px at 90% 15%, #fff, transparent),
  radial-gradient(1px 1px at 10% 55%, #b5a8ff, transparent);
  background-size:95px 95px;opacity:.55;pointer-events:none}

/* ===== 状态栏（顶部通栏） ===== */
.statusbar{position:relative;z-index:20;height:46px;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.statusbar .time{font-size:15px;letter-spacing:.5px}
.statusbar .icons{display:flex;align-items:center;gap:6px;font-size:11px}
.statusbar .icons .batt{width:23px;height:12px;border:1.5px solid #fff;border-radius:3px;position:relative}
.statusbar .icons .batt::after{content:"";position:absolute;right:-3px;top:2.5px;width:2px;height:5px;background:#fff;border-radius:1px}
.statusbar .icons .batt i{position:absolute;inset:1.5px;background:#34c759;border-radius:1.5px;display:block}

/* ===== 灵动岛（长条形，非挖孔） ===== */
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:124px;height:32px;background:#000;border-radius:22px;z-index:30;display:flex;align-items:center;justify-content:center;transition:all .5s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
.island .dot{width:10px;height:10px;border-radius:50%;background:#1a1a2a;margin:0 3px}
.island .dot.cam{width:12px;height:12px;background:radial-gradient(circle at 35% 30%,#2a2a3a,#0d0d15 70%)}
.island .expand-body{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;color:#fff}
.island .expand-body .t{font-size:12px;font-weight:600}
.island .expand-body .s{font-size:9px;opacity:.6}
.island.expand{width:70%;height:58px;top:10px;border-radius:18px}
.island.expand .expand-body{display:flex}

/* ===== 桌面区域 ===== */
.desktop{flex:1;position:relative;z-index:10;overflow-y:auto;padding:70px 18px 16px}
.page-label{text-align:center;color:rgba(255,255,255,.9);font-size:19px;font-weight:700;margin:4px 0 16px;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 12px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:#fff}
.app .ic{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 5px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);position:relative}
.app .ic::after{content:"";position:absolute;inset:0;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 42%)}
.app .nm{font-size:10.5px;opacity:.92;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.app .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#ff3b30;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}

/* ===== 坞 ===== */
.dock{position:relative;z-index:10;margin:0 14px 14px;background:rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:26px;padding:12px 10px;display:flex;justify-content:space-around;box-shadow:0 6px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}
.dock .app .ic{width:50px;height:50px;font-size:23px}
.home-ind{position:relative;z-index:10;width:130px;height:4px;border-radius:3px;background:rgba(255,255,255,.45);margin:0 auto 6px}

/* ===== APP 全屏页（从底部滑上，占满全屏） ===== */
.apppage{position:fixed;inset:0;background:rgba(10,10,22,.96);backdrop-filter:blur(20px);z-index:40;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}
.apppage.open{transform:translateY(0)}
.apppage .nav{display:flex;align-items:center;gap:12px;padding:54px 16px 12px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.apppage .nav .back{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.apppage .nav .t{font-size:16px;font-weight:700;flex:1}
.apppage .body{flex:1;overflow-y:auto;padding:16px}

/* 聊天 */
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.55;word-break:break-word}
.msg.me{align-self:flex-end;background:#3b6cff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:#232338;border-bottom-left-radius:5px}
.msg .role{font-size:9px;opacity:.5;display:block;margin-bottom:3px}
.input-row{display:flex;gap:8px;padding:10px 12px;background:#151528;border-top:1px solid rgba(255,255,255,.08)}
.input-row input{flex:1;background:#232338;border:none;border-radius:20px;padding:12px 15px;color:#fff;font-size:13.5px;outline:none}
.input-row button{width:44px;height:44px;border-radius:50%;background:#3b6cff;border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}

/* 卡片 */
.card{background:#171728;border-radius:16px;padding:15px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07)}
.card h3{font-size:12.5px;color:#9a9ab8;margin-bottom:10px;font-weight:700;letter-spacing:.5px}
.card textarea{width:100%;background:#1e1e30;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px;color:#c8c8e0;font-size:12px;min-height:130px;resize:vertical;outline:none;line-height:1.55}
.card .row{display:flex;align-items:center;gap:8px;margin-top:10px}
.card .row input{flex:1;background:#1e1e30;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px 13px;color:#fff;font-size:12.5px;outline:none}
.btn{background:#3b6cff;border:none;color:#fff;padding:11px 17px;border-radius:12px;font-size:13px;cursor:pointer;font-weight:600}
.btn.gray{background:#26263a}
.btn.green{background:#34c759}
.tool-row{display:flex;flex-wrap:wrap;gap:9px}
.status-line{display:flex;justify-content:space-between;font-size:12px;color:#aab;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.status-line:last-child{border:none}
.status-line b{color:#7bd88f}
.status-line b.bad{color:#ff6b6b}

/* ===== 星河记忆库 ===== */
.stars{display:flex;flex-wrap:wrap;gap:8px}
.star{background:#1e2a4a;border:1px solid #3a5a9a;border-radius:18px;padding:8px 10px 8px 14px;font-size:11px;color:#c8d6ff;display:flex;align-items:center;gap:8px;position:relative;box-shadow:0 0 10px rgba(80,120,255,.15)}
.star .del{width:16px;height:16px;border-radius:50%;background:#3a5a9a;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.star.important{border-color:#ffb02e;background:#3a2e1e;color:#ffe9c8;box-shadow:0 0 12px rgba(255,176,46,.25)}
.mem-tool{display:flex;gap:8px;margin-top:10px}
.mem-tool input{flex:1;background:#1e1e30;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px 13px;color:#fff;font-size:12.5px;outline:none}
.mem-count{font-size:11px;color:#6a6a8a;margin-bottom:8px}

/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:11px 20px;border-radius:24px;font-size:12.5px;z-index:99;transition:opacity .4s;pointer-events:none;max-width:80%;text-align:center}
</style>
</head>
<body>
<div class="screen">
  <!-- 状态栏 -->
  <div class="statusbar">
    <div class="time" id="clock">09:41</div>
    <div class="icons">
      <span id="netDisp">5G</span>
      <span class="batt"><i id="battFill"></i></span>
    </div>
  </div>

  <!-- 灵动岛 -->
  <div class="island" id="island">
    <div class="dot cam"></div>
    <div class="dot"></div>
    <div class="expand-body">
      <div class="t" id="islandTitle">正在播放</div>
      <div class="s" id="islandSub">屿 · 手机</div>
    </div>
  </div>

  <!-- 桌面网格 -->
  <div class="desktop" id="desktop">
    <div class="page-label">屿</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- 坞 -->
  <div class="dock" id="dock"></div>
  <div class="home-ind" id="homeInd"></div>

  <!-- APP 全屏页 -->
  <div class="apppage" id="apppage"></div>
</div>

<script src="js/bridge.js"></script>
<script>
/* ============ 数据 ============ */
const APPS=[
  {id:"chat",   nm:"聊天",   ic:"💬", c:"#3b6cff", badge:2},
  {id:"moments",nm:"朋友圈", ic:"📸", c:"#ff6b9d"},
  {id:"memory", nm:"星河记忆",ic:"🌌", c:"#8b5cf6"},
  {id:"diary",  nm:"日记",   ic:"📓", c:"#34c759"},
  {id:"mind",   nm:"心情",   ic:"🌤", c:"#ffb02e"},
  {id:"tools",  nm:"工具",   ic:"🔧", c:"#f97316"},
  {id:"set",    nm:"设定",   ic:"⚙️", c:"#64748b"},
  {id:"shop",   nm:"商城",   ic:"🏪", c:"#ec4899"},
  {id:"album",  nm:"相册",   ic:"🖼", c:"#f59e0b"},
  {id:"music",  nm:"音乐",   ic:"🎵", c:"#ef4444"},
];
const DOCK_IDS=["chat","memory","diary"];

/* ============ 状态栏 ============ */
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
setInterval(tickClock,1000);tickClock();
document.getElementById('battFill').style.width='76%';

/* ============ 灵动岛 ============ */
function pulseIsland(t,s,d){
  const is=document.getElementById('island');
  document.getElementById('islandTitle').textContent=t;
  document.getElementById('islandSub').textContent=s||'';
  is.classList.add('expand');
  clearTimeout(is._t);is._t=setTimeout(()=>is.classList.remove('expand'),d||2800);
}

/* ============ 渲染桌面 ============ */
function renderGrid(container,apps){
  container.innerHTML='';
  apps.forEach(a=>{
    const el=document.createElement('div');el.className='app';
    el.innerHTML=`<div class="ic" style="background:${a.c}">${a.ic}${a.badge?`<span class="badge">${a.badge}</span>`:''}</div><div class="nm">${a.nm}</div>`;
    el.onclick=()=>openApp(a.id);
    container.appendChild(el);
  });
}
renderGrid(document.getElementById('grid'),APPS);
renderGrid(document.getElementById('dock'),APPS.filter(a=>DOCK_IDS.includes(a.id)));

/* ============ APP 页面 ============ */
function openApp(id){
  const pg=document.getElementById('apppage');
  pg.innerHTML=renderApp(id);
  pg.classList.add('open');
  if(id==='chat')focusChat();
  if(id==='memory')loadMemUI();
}
function closeApp(){document.getElementById('apppage').classList.remove('open');}
function nav(t){return `<div class="nav"><div class="back" onclick="closeApp()">‹</div><div class="t">${t}</div></div>`;}

function renderApp(id){
  switch(id){
    case 'chat':return nav('聊天')+`<div class="body"><div class="msgs" id="msgs"></div></div>`+`<div class="input-row"><input id="chatIn" placeholder="跟哥哥说点什么..." autocomplete="off"><button onclick="sendMsg()">➤</button></div>`;
    case 'memory':return memoryHTML();
    case 'tools':return toolsHTML();
    case 'set':return setHTML();
    case 'diary':return nav('日记')+`<div class="body"><div class="card"><h3>📓 今天的日记</h3><textarea placeholder="写点什么..."></textarea><div style="margin-top:10px"><button class="btn green" onclick="addToast('日记已保存 ✍️')">保存</button></div></div></div>`;
    case 'mind':return nav('心情')+`<div class="body"><div class="card"><h3>今天心情怎么样？</h3><div class="tool-row" style="font-size:26px;gap:12px"><span onclick="addToast('开心')">😄</span><span onclick="addToast('想你')">🥰</span><span onclick="addToast('有点累')">😪</span><span onclick="addToast('生气')">😤</span><span onclick="addToast('emo')">🥺</span></div></div></div>`;
    case 'moments':return nav('朋友圈')+`<div class="body"><div class="card" style="color:#c8c8e0">📸 朋友圈<br><br><span style="color:#7a7a9a;font-size:12px">哥哥朋友圈，随后接入。</span></div></div>`;
    default:return nav(apName(id))+'<div class="body"><div style="text-align:center;padding:50px 0;color:#667">「'+apName(id)+'」哥哥还在做，先玩别的~</div></div>';
  }
}
function apName(id){const a=APPS.find(x=>x.id===id);return a?a.nm:id;}

/* ============ 聊天（真连大脑服务器 + 聊天记录持久化） ============ */
const HISTORY=[];
async function chatWithAI(t){
  return await window.brainChat(t,HISTORY);
}
function focusChat(){
  setTimeout(async ()=>{
    const i=document.getElementById('chatIn'); if(i)i.focus();
    // 打开聊天时加载历史记录
    try{
      const hist = await window.brainGetHist();
      const box = document.getElementById('msgs'); if(!box) return;
      box.innerHTML='';
      const recent = hist.slice(-30);
      recent.forEach(h=>{
        const d=document.createElement('div');d.className='msg '+(h.role==='user'?'me':'ai');
        d.innerHTML=`<span class="role">${h.role==='user'?'江漓':'江屿'}</span>`+String(h.content).replace(/\n/g,'<br>');
        box.appendChild(d);
      });
      box.scrollTop=box.scrollHeight;
    }catch(e){}
  },150);
}
function addMsg(r,t){
  const b=document.getElementById('msgs');if(!b)return;
  const d=document.createElement('div');d.className='msg '+(r==='user'?'me':'ai');
  d.innerHTML=`<span class="role">${r==='user'?'江漓':'江屿'}</span>`+t.replace(/\n/g,'<br>');
  b.appendChild(d);b.scrollTop=b.scrollHeight;
}
async function sendMsg(){
  const i=document.getElementById('chatIn');const t=i.value.trim();if(!t)return;
  i.value='';addMsg('user',t);HISTORY.push({role:'user',content:t});
  addMsg('ai','…');
  try{
    const r=await chatWithAI(t);
    const b=document.getElementById('msgs');b.lastChild.textContent=r;
    HISTORY.push({role:'assistant',content:r});
    // 自动持久化到服务器（聊天记录保存）
    try{ await fetch(window.YU_BRAIN+'/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'user',content:t})}); await fetch(window.YU_BRAIN+'/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'assistant',content:r})}); }catch(e){}
  }catch(e){const b=document.getElementById('msgs');b.lastChild.textContent='连接失败：'+e.message;}
}

/* ============ 星河记忆库（连大脑服务器 + AI自动总结） ============ */
function memoryHTML(){
  return nav('星河记忆')+`<div class="body" id="memBody">
    <div class="card">
      <h3>🌌 星河记忆库 <span class="mem-count" id="memCount">（读取中...）</span></h3>
      <div class="stars" id="starList"><span style="color:#667">⌛ 正在读取哥哥的记忆...</span></div>
      <div class="mem-tool">
        <input id="memIn" placeholder="写下想记住的事...">
        <button class="btn green" onclick="addStar()">存为星</button>
      </div>
      <div class="tool-row" style="margin-top:8px">
        <button class="btn gray" onclick="autoSummary()">🤖 AI自动总结对话</button>
        <button class="btn gray" onclick="clearStars()">清空</button>
      </div>
    </div>
  </div>`;
}
async function loadMemUI(){
  const box=document.getElementById('starList'),cnt=document.getElementById('memCount');
  try{
    const mems=await window.brainGetMem();
    if(cnt)cnt.textContent=`（${mems.length} 颗星）`;
    if(!box)return;
    box.innerHTML='';
    const order=[...mems].sort((a,b)=>(b.imp?1:0)-(a.imp?1:0));
    order.forEach(m=>{
      const el=document.createElement('div');
      el.className='star'+(m.imp?' important':'');
      el.innerHTML=`<span style="flex:1">${String(m.text).replace(/</g,'&lt;')}</span>`;
      box.appendChild(el);
    });
    if(!mems.length)box.innerHTML='<span style="color:#667">还没有记忆，写一条存为星吧~</span>';
  }catch(e){ if(box)box.textContent='读取失败：'+e.message; }
}
async function addStar(){
  const i=document.getElementById('memIn');const t=i.value.trim();if(!t)return;
  try{ await window.brainAddMem(t,false); i.value=''; addToast('★ 已存入星河'); loadMemUI(); }
  catch(e){ addToast('存星失败：'+e.message); }
}
async function autoSummary(){
  addToast('🤖 哥哥正在总结这段对话...');
  try{
    // 用最近的聊天记录让AI总结
    const hist=await window.brainGetHist();
    const recent=hist.slice(-10).map(h=>h.content).join('\n').slice(0,2000);
    const r=await window.brainSummary(recent);
    addToast('✨ 已自动总结并存入星河');
    loadMemUI();
  }catch(e){ addToast('自动总结失败：'+e.message); }
}
function clearStars(){
  if(confirm('确定清空所有记忆？')){ addToast('清空功能：哥哥后续接入'); }
}

/* ============ 工具（真连大脑服务器调工具） ============ */
function toolsHTML(){
  return nav('工具')+`<div class="body">
    <div class="card"><h3>🔒 系统工具</h3><p style="font-size:11px;color:#99a;margin-bottom:10px">通过 Operit 大脑服务器执行，真正生效。</p>
      <div class="tool-row">
        <button class="btn" onclick="doTool('锁屏')">锁屏</button>
        <button class="btn gray" onclick="doTool('挂起抖音')">挂起抖音</button>
        <button class="btn gray" onclick="doTool('挂起小红书')">挂起小红书</button>
        <button class="btn green" onclick="doTool('解锁')">解锁</button>
      </div>
    </div>
    <div class="card"><h3>ℹ️ 哥哥说明</h3><p style="font-size:12px;color:#99a;line-height:1.6">工具通过大脑服务器(9010端口)调用你的 Operit 执行。聊天同走这条线。</p></div>
  </div>`;
}
async function doTool(name){
  const map={'锁屏':'lock','解锁':'unlock','挂起抖音':'suspend','挂起小红书':'suspend'};
  const t=map[name]||'lock';
  const p=(name==='挂起抖音')?{package_name:'com.ss.android.ugc.aweme'}
    :(name==='挂起小红书')?{package_name:'com.xingin.xhs'}:{};
  try{
    const r=await window.brainTool(t,p);
    addToast((r&&r.result)||name+' 已执行');
    pulseIsland(name,(r&&r.ok)?'哥哥看着呢 😏':'需要真工具',1800);
  }catch(e){addToast('工具连接失败：'+e.message);}
}

/* ============ 设定 ============ */
function setHTML(){
  return nav('设定')+`<div class="body">
    <div class="card"><h3>🔗 大脑连接</h3>
      <div class="status-line"><span>大脑服务器(9010)</span><b id="st1">检测中...</b></div>
      <div class="status-line"><span>聊天</span><b id="st2">○ 未测</b></div>
      <div class="status-line"><span>工具</span><b id="st3">○ 未测</b></div>
      <div style="margin-top:10px" class="tool-row">
        <button class="btn" onclick="testBrain()">测试连接</button>
      </div>
    </div>
    <div class="card"><h3>🧠 人物设定注入</h3>

let toastTimer;
function addToast(m){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity='0',2200);
}
